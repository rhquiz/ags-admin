<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGS Serviços | Painel Administrativo</title><style>
:root{--bg:#0c1018;--side:#101620;--card:#171e2a;--line:#2b3544;--text:#edf1f7;--muted:#98a6b8;--gold:#d9b46b;--blue:#60a5fa;--green:#45caa0;--red:#f07c82}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Segoe UI,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:248px;background:var(--side);border-right:1px solid var(--line);padding:24px 14px;overflow:auto}.logo{font-weight:900;font-size:24px;color:var(--gold);padding:8px 12px 25px}.logo small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px}.nav{width:100%;display:flex;gap:11px;align-items:center;border:0;background:none;color:#afbac8;text-align:left;padding:13px;border-radius:10px;margin-bottom:5px}.nav:hover,.nav.active{background:#283243;color:white}.nav.active{border-left:3px solid var(--gold)}main{margin-left:248px;padding:27px;max-width:1700px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:25px}.top h1{font-size:26px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.tag{display:inline-block;border-radius:30px;padding:6px 10px;background:#263345;color:#c9d8eb;font-size:12px}.gold{color:var(--gold)}.btn{border:0;background:var(--gold);color:#151a22;border-radius:9px;padding:11px 16px;font-weight:750}.btn:hover{filter:brightness(1.08)}.btn.secondary{background:#2c394a;color:white}.btn.danger{background:#4d2730;color:#ffb9bd}.btn:disabled{opacity:.45;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px}.card strong{font-size:28px;display:block;margin-top:12px}.panel{margin-top:18px}.panel h2{font-size:18px;margin:0 0 17px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}label{display:block;color:#c4cfda;font-size:12px;margin:0 0 6px}input,select,textarea{width:100%;padding:11px;border-radius:9px;background:#101722;color:white;border:1px solid #354154;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold)}textarea{min-height:78px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid var(--line);padding:13px 10px;vertical-align:middle}th{color:var(--muted);font-weight:600;font-size:12px}td{word-break:break-word}.tablewrap{overflow:auto}.pill{border-radius:40px;padding:5px 9px;background:#314053;font-size:11px;white-space:nowrap}.pill.ok{background:#164a3e;color:#a1f0d2}.pill.late{background:#572d38;color:#ffb7c0}.pill.wait{background:#54472c;color:#f7db9e}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.notice{background:#292b29;border:1px solid #655839;border-radius:12px;padding:14px;color:#e9d7ad;margin-bottom:18px}.hide{display:none!important}.section{margin:15px 0;color:var(--gold);font-weight:800;font-size:15px}.empty{padding:24px;text-align:center;color:var(--muted)}.divider{border-top:1px solid var(--line);margin:22px 0}.foot{margin-top:25px;color:#728195;font-size:11px}.mobile{display:none}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){aside{position:static;width:auto;padding:12px}.logo{padding:5px 10px}.menu{display:flex;overflow:auto}.nav{flex:0 0 auto;width:auto;white-space:nowrap;padding:9px}main{margin:0;padding:16px}.top{align-items:flex-start}.cards,.grid,.grid.two{grid-template-columns:1fr}.card strong{font-size:23px}}

.auth-screen{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(430px,100%);background:#161719;border:1px solid #625039;border-radius:18px;padding:28px}.auth-card input{width:100%;margin:8px 0 14px}.auth-card h1{color:#e4ba69}.auth-error{color:#ffb4a8;font-size:13px;min-height:20px}.hidden{display:none!important}.badge-mini{font-size:12px;color:#f0c77c}.docbtn{margin:3px 6px 3px 0}.readonly{color:#b3aca2}.grid-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.info{background:#202123;border:1px solid #373536;border-radius:9px;padding:12px}.info small{display:block;color:#b3a99a;margin-bottom:5px}.info b{overflow-wrap:anywhere}
</style></head><body>
<div class="auth-screen" id="login"><div class="auth-card"><h1>◆ AGS SERVIÇOS</h1><p class="muted">Acesso administrativo • Área restrita</p><form id="loginForm"><label>E-mail</label><input id="email" type="email" autocomplete="username" required placeholder="seu@email.com"><label>Senha</label><input id="password" type="password" autocomplete="current-password" required placeholder="Sua senha"><button class="btn" id="loginBtn">Entrar no painel</button></form><p id="loginError" class="auth-error"></p><p class="muted small">Somente usuários autorizados pela AGS podem acessar cadastros e documentos.</p></div></div>
<div id="app" class="hidden"><aside><div class="logo">◆ AGS <span style="color:white">SERVIÇOS</span><small>GESTÃO DE EMPRÉSTIMOS</small></div><div class="menu" id="menu"></div><div class="foot">DADOS REAIS • ACESSO RESTRITO<br><button class="btn secondary" onclick="logout()">Sair da conta</button></div></aside><main><header class="top"><div><h1 id="heading">Visão geral</h1><div class="muted small" id="subtitle">Painel administrativo • Supabase</div></div><span class="tag" id="userTag">AGS • Acesso seguro</span></header><div id="content"></div></main></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://dmgtwclvbwxocspksqon.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_ACveKWak5y3MBik4VvClww_f-OWm-DI';
const API=SUPABASE_URL+'/functions/v1/ags-admin-api';
const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const formatDate=v=>v?new Date(v).toLocaleDateString('pt-BR'):'—';
let currentPage='dashboard', clients=[],profile=null,chosen=null,loading=false;
const fields=[['Nome completo','nome_completo'],['CPF','cpf'],['Telefone','telefone'],['Endereço residencial','endereco_casa'],['Tipo de moradia','tipo_moradia'],['Empresa','nome_empresa'],['Telefone empresa','telefone_empresa'],['Endereço trabalho','endereco_trabalho'],['Função','funcao'],['Segundo endereço','segundo_endereco'],['Referência','nome_referencia'],['Parentesco referência','parentesco_referencia'],['Telefone referência','telefone_referencia'],['Familiar 1 telefone','parente1_telefone'],['Familiar 1 parentesco','parente1_parentesco'],['Familiar 2 telefone','parente2_telefone'],['Familiar 2 parentesco','parente2_parentesco'],['Familiar 3 telefone','parente3_telefone'],['Familiar 3 parentesco','parente3_parentesco'],['Chave PIX','chave_pix'],['Banco','banco'],['Parcelas solicitadas','quantidade_parcelas']];
const docs=[['Comprovante de endereço','comprovante_endereco'],['Foto da frente da casa','foto_frente_casa'],['Foto do documento','foto_documento'],['Holerite','holerite'],['Carteira de trabalho digital','carteira_trabalho']];
const menu=[['dashboard','◈','Visão geral'],['clients','♙','Clientes'],['documents','▧','Documentos'],['loans','▣','Empréstimos'],['payments','▤','Parcelas'],['whatsapp','◉','WhatsApp automático'],['reports','▥','Relatórios'],['access','⚿','Permissões']];
async function call(action,extra={}){const {data:{session}}=await supabase.auth.getSession();if(!session)throw Error('Sua sessão expirou. Entre novamente.');const response=await fetch(API,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...extra})});let json;try{json=await response.json()}catch{throw Error('Resposta inválida do servidor.')}if(!response.ok||!json.ok)throw Error(json.erro||'Falha na consulta.');return json;}
async function refresh(){loading=true;render();try{const r=await call('list');clients=r.cadastros||[];profile=r.perfil;loading=false;render();}catch(e){loading=false;clients=[];render();alert(e.message);if(e.message.includes('autorizado')||e.message.includes('sessão'))await logout();}}
window.nav=(p)=>{currentPage=p;chosen=null;render()};
window.openClient=(id)=>{chosen=clients.find(c=>c.id===id);currentPage='detail';render()};
window.filterClients=()=>{const q=$('search')?.value?.toLowerCase()||'';const list=clients.filter(c=>[c.nome_completo,c.cpf,c.telefone].some(v=>String(v||'').toLowerCase().includes(q)));$('clientRows').innerHTML=rows(list)};
window.openDoc=async(id,field)=>{const b=$('doc_'+field);if(b)b.disabled=true;try{const r=await call('document',{cadastro_id:id,campo:field});window.open(r.url,'_blank','noopener,noreferrer');}catch(e){alert(e.message)}finally{if(b)b.disabled=false}};
window.logout=async()=>{await supabase.auth.signOut();clients=[];profile=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''};
function rows(list){return list.map(c=>`<tr><td>${esc(c.nome_completo||'Não informado')}</td><td>${esc(c.cpf)}</td><td>${esc(c.telefone)}</td><td>${formatDate(c.criado_em)}</td><td><button class="btn secondary" onclick="openClient('${esc(c.id)}')">Ver cadastro</button></td></tr>`).join('')||'<tr><td colspan="5">Nenhum cadastro encontrado.</td></tr>'}
function dashboard(){return `<div class="notice">✓ Conectado ao Supabase. Os cadastros exibidos vêm da tabela real da AGS. A parte financeira será ativada depois da configuração das tabelas e permissões.</div><div class="cards"><div class="card"><span class="muted">Clientes cadastrados</span><strong>${clients.length}</strong></div><div class="card"><span class="muted">Cadastros novos</span><strong>${clients.filter(c=>c.status==='Novo').length}</strong></div><div class="card"><span class="muted">Documentos registrados</span><strong>${clients.reduce((n,c)=>n+docs.filter(([l,k])=>c[k]).length,0)}</strong></div><div class="card"><span class="muted">Seu acesso</span><strong style="font-size:19px">${profile==='admin'?'Proprietário':'Funcionário'}</strong></div></div><div class="panel"><h2>Últimos cadastros</h2>${clientTable(clients.slice(0,8))}</div>`}
function clientTable(list){return `<div class="tablewrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Data</th><th>Ação</th></tr></thead><tbody id="clientRows">${rows(list)}</tbody></table></div>`}
function clientsPage(){return `<div class="actions"><button class="btn secondary" onclick="refreshData()">↻ Atualizar cadastros</button><input id="search" style="max-width:340px" placeholder="Pesquisar nome, CPF ou telefone" oninput="filterClients()"></div><div class="panel">${clientTable(clients)}</div>`}
window.refreshData=refresh;
function detail(){const c=chosen;if(!c)return '<div class="panel">Cadastro não encontrado.</div>';return `<div class="actions"><button class="btn secondary" onclick="nav('clients')">← Voltar</button></div><div class="panel"><h2>${esc(c.nome_completo||'Cadastro')}</h2><p class="muted small">ID: ${esc(c.id)} • ${formatDate(c.criado_em)}</p><div class="grid-info">${fields.map(([label,key])=>`<div class="info"><small>${label}</small><b>${esc(c[key]||'—')}</b></div>`).join('')}</div></div><div class="panel"><h2>Documentos do cliente</h2>${docList(c)}</div>`}
function docList(c){return docs.map(([label,key])=>`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-bottom:1px solid #373536"><span>${esc(label)}</span>${c[key]?`<button class="btn secondary docbtn" id="doc_${key}" onclick="openDoc('${esc(c.id)}','${key}')">Abrir documento</button>`:'<span class="muted">Não enviado</span>'}</div>`).join('')}
function documents(){return `<div class="notice">Os documentos ficam em armazenamento privado. Cada botão solicita um link temporário, liberado somente após verificar o login e a autorização.</div>${clients.map(c=>`<div class="panel"><h2>${esc(c.nome_completo||'Cadastro')}</h2>${docList(c)}</div>`).join('')||'<div class="panel">Nenhum cliente encontrado.</div>'}`}
function pending(name){return `<div class="notice"><b>⏳ ${name}: próxima etapa de desenvolvimento</b><p>Esta área ainda não está conectada ao banco. Não serão criados empréstimos, parcelas ou alterações financeiras fictícias neste painel real.</p></div>`}
function whatsapp(){return `<div class="notice"><b>⏳ WhatsApp automático — aguardando ativação</b><p>Será necessário um número exclusivo, ativação na Meta, aprovação dos modelos de mensagens e integração ao Supabase. Nenhuma mensagem é enviada por esta tela.</p></div><div class="panel"><h2>Mensagens previstas</h2><p>• Lembrete antes do vencimento</p><p>• Aviso no dia do vencimento</p><p>• Aviso de atraso</p><p>• Confirmação de pagamento</p></div>`}
function access(){return `<div class="panel"><h2>Seu perfil: ${profile==='admin'?'Proprietário / Administrador':'Funcionário'}</h2><p>O acesso aos dados é autorizado pelo servidor e não por senha 1234 no navegador.</p><p>Funcionários podem consultar cadastros e documentos. O controle de alteração dos valores financeiros será protegido por regras no banco quando o módulo financeiro for implementado.</p></div>`}
function render(){if($('app').classList.contains('hidden'))return;const names={dashboard:'Visão geral',clients:'Clientes cadastrados',detail:'Dados do cliente',documents:'Documentos',loans:'Empréstimos',payments:'Parcelas',whatsapp:'WhatsApp automático',reports:'Relatórios',access:'Permissões'};$('heading').textContent=names[currentPage]||'AGS';$('menu').innerHTML=menu.map(([key,icon,label])=>`<button class="nav ${currentPage===key?'active':''}" onclick="nav('${key}')"><span>${icon}</span>${label}</button>`).join('');$('content').innerHTML=loading?'<div class="panel">Carregando cadastros do Supabase...</div>':({dashboard,clients:clientsPage,detail,documents,loans:()=>pending('Empréstimos'),payments:()=>pending('Parcelas'),whatsapp,reports:()=>pending('Relatórios financeiros'),access})[currentPage]();}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';$('loginBtn').disabled=true;try{if(SUPABASE_ANON_KEY.startsWith('COLE_AQUI'))throw Error('Falta configurar a chave publicável do Supabase no HTML.');const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw Error('E-mail ou senha inválidos.');$('login').classList.add('hidden');$('app').classList.remove('hidden');await refresh()}catch(err){$('loginError').textContent=err.message;}finally{$('loginBtn').disabled=false}});
const {data:{session}}=await supabase.auth.getSession();if(session){$('login').classList.add('hidden');$('app').classList.remove('hidden');await refresh();}
</script></body></html>
