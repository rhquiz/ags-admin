<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AGS Serviços | Painel Administrativo</title><style>
:root{--bg:#0c1018;--side:#101620;--card:#171e2a;--line:#2b3544;--text:#edf1f7;--muted:#98a6b8;--gold:#d9b46b;--blue:#60a5fa;--green:#45caa0;--red:#f07c82}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Segoe UI,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:248px;background:var(--side);border-right:1px solid var(--line);padding:24px 14px;overflow:auto}.logo{font-weight:900;font-size:24px;color:var(--gold);padding:8px 12px 25px}.logo small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px}.nav{width:100%;display:flex;gap:11px;align-items:center;border:0;background:none;color:#afbac8;text-align:left;padding:13px;border-radius:10px;margin-bottom:5px}.nav:hover,.nav.active{background:#283243;color:white}.nav.active{border-left:3px solid var(--gold)}main{margin-left:248px;padding:27px;max-width:1700px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:25px}.top h1{font-size:26px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.tag{display:inline-block;border-radius:30px;padding:6px 10px;background:#263345;color:#c9d8eb;font-size:12px}.gold{color:var(--gold)}.btn{border:0;background:var(--gold);color:#151a22;border-radius:9px;padding:11px 16px;font-weight:750}.btn:hover{filter:brightness(1.08)}.btn.secondary{background:#2c394a;color:white}.btn.danger{background:#4d2730;color:#ffb9bd}.btn:disabled{opacity:.45;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px}.card strong{font-size:28px;display:block;margin-top:12px}.panel{margin-top:18px}.panel h2{font-size:18px;margin:0 0 17px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}label{display:block;color:#c4cfda;font-size:12px;margin:0 0 6px}input,select,textarea{width:100%;padding:11px;border-radius:9px;background:#101722;color:white;border:1px solid #354154;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold)}textarea{min-height:78px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid var(--line);padding:13px 10px;vertical-align:middle}th{color:var(--muted);font-weight:600;font-size:12px}td{word-break:break-word}.tablewrap{overflow:auto}.pill{border-radius:40px;padding:5px 9px;background:#314053;font-size:11px;white-space:nowrap}.pill.ok{background:#164a3e;color:#a1f0d2}.pill.late{background:#572d38;color:#ffb7c0}.pill.wait{background:#54472c;color:#f7db9e}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.notice{background:#292b29;border:1px solid #655839;border-radius:12px;padding:14px;color:#e9d7ad;margin-bottom:18px}.hide{display:none!important}.section{margin:15px 0;color:var(--gold);font-weight:800;font-size:15px}.empty{padding:24px;text-align:center;color:var(--muted)}.divider{border-top:1px solid var(--line);margin:22px 0}.foot{margin-top:25px;color:#728195;font-size:11px}.mobile{display:none}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){aside{position:static;width:auto;padding:12px}.logo{padding:5px 10px}.menu{display:flex;overflow:auto}.nav{flex:0 0 auto;width:auto;white-space:nowrap;padding:9px}main{margin:0;padding:16px}.top{align-items:flex-start}.cards,.grid,.grid.two{grid-template-columns:1fr}.card strong{font-size:23px}}

.auth-screen{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(430px,100%);background:#161719;border:1px solid #625039;border-radius:18px;padding:28px}.auth-card input{width:100%;margin:8px 0 14px}.auth-card h1{color:#e4ba69}.auth-error{color:#ffb4a8;font-size:13px;min-height:20px}.hidden{display:none!important}.badge-mini{font-size:12px;color:#f0c77c}.docbtn{margin:3px 6px 3px 0}.readonly{color:#b3aca2}.grid-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.info{background:#202123;border:1px solid #373536;border-radius:9px;padding:12px}.info small{display:block;color:#b3a99a;margin-bottom:5px}.info b{overflow-wrap:anywhere}
.reportHero{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:linear-gradient(115deg,#202a39,#141b27);border:1px solid #4b4234;border-radius:16px;padding:24px}.reportTabs{display:flex;flex-wrap:wrap;gap:9px}.reportTab{background:#263243;color:#d5deeb;border:1px solid #39465a;border-radius:10px;padding:12px 16px;font-weight:700}.reportTab.selected{background:#d9b46b;color:#141923;border-color:#d9b46b}.reportTab:hover{border-color:#d9b46b}@media print{aside,.top{display:none}main{margin:0}}
</style></head><body>
<div class="auth-screen" id="login"><div class="auth-card"><h1>◆ AGS SERVIÇOS</h1><p class="muted">Acesso administrativo • Área restrita</p><form id="loginForm"><label>E-mail</label><input id="email" type="email" autocomplete="username" required placeholder="seu@email.com"><label>Senha</label><input id="password" type="password" autocomplete="current-password" required placeholder="Sua senha"><button class="btn" id="loginBtn">Entrar no painel</button></form><p id="loginError" class="auth-error"></p><p class="muted small">Somente usuários autorizados pela AGS podem acessar cadastros e documentos.</p></div></div>
<div id="app" class="hidden"><aside><div class="logo">◆ AGS <span style="color:white">SERVIÇOS</span><small>GESTÃO DE EMPRÉSTIMOS</small></div><div class="menu" id="menu"></div><div class="foot">DADOS REAIS • ACESSO RESTRITO<br><button class="btn secondary" onclick="logout()">Sair da conta</button></div></aside><main><header class="top"><div><h1 id="heading">Visão geral</h1><div class="muted small" id="subtitle">Painel administrativo • AGS Serviços</div></div><span class="tag" id="userTag">AGS • Acesso seguro</span></header><div id="content"></div></main></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://dmgtwclvbwxocspksqon.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_ACveKWak5y3MBik4VvClww_f-OWm-DI';
const API=SUPABASE_URL+'/functions/v1/ags-admin-api';
const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const formatDate=v=>v?new Date(v).toLocaleDateString('pt-BR'):'—';
const statusOf=c=>['aprovado','reprovado'].includes(c.situacao_cadastro)?c.situacao_cadastro:'pendente';
const statusBadge=c=>{const st=statusOf(c);return `<span class="pill ${st==='aprovado'?'ok':st==='reprovado'?'late':'wait'}">${st==='aprovado'?'Aprovado':st==='reprovado'?'Reprovado':'Pendente'}</span>`};
let clientStatusFilter='todos'; let currentPage='dashboard', clients=[],profile=null,chosen=null,loading=false,loans=[],installments=[],financeLoaded=false,permissions={},staff=[];
const areas=['dashboard','clients','documents','loans','payments','overdue','whatsapp','reports'];
const permissionKeys=['view','create','edit','edit_values','edit_dates','pay'];
const can=(area,action='view')=>profile==='admin'||permissions?.[area]?.includes(action)||false;
const fields=[['Nome completo','nome_completo'],['CPF','cpf'],['Telefone','telefone'],['Endereço residencial','endereco_casa'],['Tipo de moradia','tipo_moradia'],['Empresa','nome_empresa'],['Telefone empresa','telefone_empresa'],['Endereço trabalho','endereco_trabalho'],['Função','funcao'],['Segundo endereço','segundo_endereco'],['Referência','nome_referencia'],['Parentesco referência','parentesco_referencia'],['Telefone referência','telefone_referencia'],['Familiar 1 telefone','parente1_telefone'],['Familiar 1 parentesco','parente1_parentesco'],['Familiar 2 telefone','parente2_telefone'],['Familiar 2 parentesco','parente2_parentesco'],['Familiar 3 telefone','parente3_telefone'],['Familiar 3 parentesco','parente3_parentesco'],['Chave PIX','chave_pix'],['Banco','banco'],['Parcelas solicitadas','quantidade_parcelas']];
const docs=[['Comprovante de endereço','comprovante_endereco'],['Foto da frente da casa','foto_frente_casa'],['Foto do documento','foto_documento'],['Holerite','holerite'],['Carteira de trabalho digital','carteira_trabalho']];
const menu=[['dashboard','◈','Visão geral'],['clients','♙','Clientes'],['documents','▧','Documentos'],['loans','▣','Empréstimos'],['payments','▤','Parcelas'],['overdue','⚠','Vencidos'],['whatsapp','◉','WhatsApp automático'],['reports','▥','Relatórios'],['access','⚿','Gestão de Acessos']];
async function call(action,extra={}){const {data:{session}}=await supabase.auth.getSession();if(!session)throw Error('Sua sessão expirou. Entre novamente.');const response=await fetch(API,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...extra})});let json;try{json=await response.json()}catch{throw Error('Resposta inválida do servidor.')}if(!response.ok||!json.ok)throw Error(json.erro||'Falha na consulta.');return json;}
async function refresh(){loading=true;render();try{const r=await call('list');clients=r.cadastros||[];profile=r.perfil;permissions=r.permissoes||{};if(!can(currentPage==='detail'?'clients':currentPage))currentPage=areas.find(a=>can(a))||'dashboard';loading=false;render();if(['loans','payments','overdue','reports'].includes(currentPage))await loadFinance();}catch(e){loading=false;clients=[];render();alert(e.message);if(e.message.includes('autorizado')||e.message.includes('sessão'))await logout();}}
window.nav=async(p)=>{if(!can(p))return alert('Seu usuário não tem acesso a esta área.');currentPage=p;chosen=null;render();if(['loans','payments','overdue','reports'].includes(p))await loadFinance();if(p==='access')await loadStaff()};
window.openClient=(id)=>{if(!can('clients'))return;chosen=clients.find(c=>c.id===id);currentPage='detail';render()};
window.filterClients=()=>{const q=($('search')?.value||'').toLowerCase();const list=clients.filter(c=>(clientStatusFilter==='todos'||statusOf(c)===clientStatusFilter)&&[c.nome_completo,c.cpf,c.telefone].some(v=>String(v||'').toLowerCase().includes(q)));$('clientRows').innerHTML=rows(list)};
window.setClientFilter=st=>{clientStatusFilter=st;document.querySelectorAll('[data-client-filter]').forEach(b=>b.classList.toggle('selected',b.dataset.clientFilter===st));filterClients()};
window.openDoc=async(id,field)=>{if(!can('documents')&&!can('clients'))return alert('Sem acesso a documentos.');const b=$('doc_'+field);if(b)b.disabled=true;try{const r=await call('document',{cadastro_id:id,campo:field});window.open(r.url,'_blank','noopener,noreferrer');}catch(e){alert(e.message)}finally{if(b)b.disabled=false}};
window.logout=async()=>{await supabase.auth.signOut();clients=[];profile=null;permissions={};staff=[];$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''};
function rows(list){return list.map(c=>`<tr><td>${esc(c.nome_completo||'Não informado')}</td><td>${esc(c.cpf)}</td><td>${esc(c.telefone)}</td><td>${formatDate(c.criado_em)}</td><td>${statusBadge(c)}</td><td><div class="actions"><button class="btn secondary" onclick="openClient('${esc(c.id)}')">Ver cadastro</button><button class="btn secondary" onclick="reviewClient('${esc(c.id)}')">Aprovar / Reprovar</button>${can('clients','delete')?`<button class="btn danger" onclick="deleteClient('${esc(c.id)}')">Excluir</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="6">Nenhum cadastro encontrado.</td></tr>'}
function dashboard(){return `<div class="notice">✓ Sistema AGS conectado. Informações atualizadas e acesso protegido.</div><div class="cards"><div class="card"><span class="muted">Clientes cadastrados</span><strong>${clients.length}</strong></div><div class="card"><span class="muted">Pendentes de análise</span><strong>${clients.filter(c=>statusOf(c)==='pendente').length}</strong></div><div class="card"><span class="muted">Documentos registrados</span><strong>${clients.reduce((n,c)=>n+docs.filter(([l,k])=>c[k]).length,0)}</strong></div><div class="card"><span class="muted">Seu acesso</span><strong style="font-size:19px">${profile==='admin'?'Proprietário':'Funcionário'}</strong></div></div><div class="panel"><h2>Últimos cadastros</h2>${clientTable(clients.slice(0,8))}</div>`}
function clientTable(list){return `<div class="tablewrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Data</th><th>Situação</th><th>Ações</th></tr></thead><tbody id="clientRows">${rows(list)}</tbody></table></div>`}
function clientsPage(){const n=st=>clients.filter(c=>statusOf(c)===st).length;return `<div class="cards" style="margin-bottom:18px"><div class="card"><span class="muted">Todos os cadastros</span><strong>${clients.length}</strong></div><div class="card"><span class="muted">Pendentes de análise</span><strong>${n('pendente')}</strong></div><div class="card"><span class="muted">Aprovados</span><strong style="color:var(--green)">${n('aprovado')}</strong></div><div class="card"><span class="muted">Reprovados</span><strong style="color:var(--red)">${n('reprovado')}</strong></div></div><div class="actions" style="margin-bottom:15px"><button class="btn secondary" onclick="refreshData()">↻ Atualizar cadastros</button><input id="search" style="max-width:340px" placeholder="Pesquisar nome, CPF ou telefone" oninput="filterClients()"></div><div class="reportTabs">${[['todos','Todos'],['pendente','Pendentes'],['aprovado','Aprovados'],['reprovado','Reprovados']].map(([st,label])=>`<button class="reportTab ${clientStatusFilter===st?'selected':''}" data-client-filter="${st}" onclick="setClientFilter('${st}')">${label}</button>`).join('')}</div><div class="panel">${clientTable(clients.filter(c=>clientStatusFilter==='todos'||statusOf(c)===clientStatusFilter))}</div><div id="clientReviewModal"></div>`}
window.refreshData=refresh;
function detail(){const c=chosen;if(!c)return '<div class="panel">Cadastro não encontrado.</div>';return `<div class="actions"><button class="btn secondary" onclick="nav('clients')">← Voltar</button></div><div class="panel"><h2>${esc(c.nome_completo||'Cadastro')} ${statusBadge(c)}</h2><div class="actions" style="margin:12px 0"><button class="btn" onclick="reviewClient('${esc(c.id)}')">Aprovar / Reprovar</button>${can('clients','delete')?`<button class="btn danger" onclick="deleteClient('${esc(c.id)}')">Excluir cadastro</button>`:''}</div><p class="muted small">ID: ${esc(c.id)} • ${formatDate(c.criado_em)}</p>${can('clients','edit')?`<div class="actions" style="margin:12px 0"><button class="btn secondary" onclick="editClient('${esc(c.id)}')">✎ Editar dados do cliente</button></div>`:''}<div class="grid-info">${fields.map(([label,key])=>`<div class="info"><small>${label}</small><b>${esc(c[key]||'—')}</b></div>`).join('')}</div></div><div class="panel"><h2>Documentos do cliente</h2>${docList(c)}</div><div id="clientReviewModal"></div>`}
function docList(c){return docs.map(([label,key])=>`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-bottom:1px solid #373536"><span>${esc(label)}</span>${c[key]?`<button class="btn secondary docbtn" id="doc_${key}" onclick="openDoc('${esc(c.id)}','${key}')">Abrir documento</button>`:'<span class="muted">Não enviado</span>'}</div>`).join('')}
function documents(){return `<div class="notice">Documentos privados: links temporários liberados após autenticação.</div><div class="panel"><input id="docSearch" placeholder="Pesquisar por nome ou CPF" oninput="filterDocs()"></div><div id="docResults">${docResults('')}</div>`}
function docResults(q){const list=clients.filter(c=>[c.nome_completo,c.cpf].some(v=>String(v||'').toLowerCase().includes(q)));return list.map(c=>`<details class="panel"><summary style="cursor:pointer;font-weight:700">${esc(c.nome_completo||'Cadastro')} • ${esc(c.cpf||'CPF não informado')}</summary><div style="margin-top:15px">${docList(c)}</div></details>`).join('')||'<div class="panel">Nenhum cliente encontrado.</div>'}
window.filterDocs=()=>{$('docResults').innerHTML=docResults(($('docSearch')?.value||'').toLowerCase())};

window.reviewClient=id=>{if(!can('clients'))return alert('Sem permissão para analisar.');const c=customer(id);if(!c)return;const target=$('clientReviewModal');if(!target)return;const current=statusOf(c);target.innerHTML=`<div class="panel" style="border-color:var(--gold);margin-top:18px" id="reviewBox"><h2>◆ Analisar cadastro — ${esc(c.nome_completo)}</h2><p class="muted">Confira os documentos acima ou na aba Documentos antes de confirmar.</p><p>Situação atual: ${statusBadge(c)}</p><form onsubmit="submitReview(event,'${esc(id)}')"><div class="grid two"><div><label>Nova situação</label><select id="reviewStatus" onchange="document.getElementById('reviewReasonBox').classList.toggle('hide',this.value!=='reprovado')"><option value="aprovado" ${current==='aprovado'?'selected':''}>Aprovado</option><option value="reprovado" ${current==='reprovado'?'selected':''}>Reprovado</option><option value="pendente" ${current==='pendente'?'selected':''}>Pendente de análise</option></select></div><div id="reviewReasonBox" class="${current==='reprovado'?'':'hide'}"><label>Motivo da reprovação (obrigatório)</label><textarea id="reviewReason" maxlength="1000" placeholder="Informe o motivo">${esc(c.motivo_reprovacao||'')}</textarea></div></div><div class="actions" style="margin-top:14px"><button class="btn" type="submit">Confirmar decisão</button><button class="btn secondary" type="button" onclick="document.getElementById('clientReviewModal').innerHTML=''">Cancelar</button></div></form></div>`;target.scrollIntoView({behavior:'smooth',block:'center'})};
window.submitReview=async(e,id)=>{e.preventDefault();const situacao=$('reviewStatus').value,motivo=($('reviewReason')?.value||'').trim();if(situacao==='reprovado'&&!motivo)return alert('Informe o motivo da reprovação.');if(!confirm('Confirmar a situação do cadastro?'))return;const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;try{await call('client_review',{cadastro_id:id,situacao,motivo:situacao==='reprovado'?motivo:null});await refresh();chosen=customer(id);alert('Situação do cadastro atualizada!')}catch(err){alert(err.message)}finally{btn.disabled=false}};
window.deleteClient=async id=>{if(!can('clients','delete'))return alert('Sem permissão para excluir.');const c=customer(id);if(!c)return;if(!confirm(`Excluir o cadastro de ${c.nome_completo}?\nO cadastro será retirado da lista, mas o histórico ficará preservado.`))return;try{await call('client_delete',{cadastro_id:id});chosen=null;currentPage='clients';await refresh();alert('Cadastro excluído da lista.') }catch(err){alert(err.message)}};
function localDate(s){if(!s)return '—';const [y,m,d]=s.slice(0,10).split('-');return `${d}/${m}/${y}`}
function todayLocal(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function daysLate(s){const a=new Date(s+'T12:00:00'),b=new Date(todayLocal()+'T12:00:00');return Math.max(0,Math.round((b-a)/86400000))}
function customer(id){return clients.find(c=>c.id===id)}
function loanById(id){return loans.find(l=>l.id===id)}
function customerName(loan){return customer(loan?.cadastro_id)?.nome_completo||'Cliente não localizado'}
async function loadFinance(){try{const r=await call('finance_list');loans=r.emprestimos||[];installments=r.parcelas||[];financeLoaded=true;render()}catch(e){financeLoaded=false;alert('Financeiro: '+e.message);render()}}
function loansPage(){return `<div class="notice">Empréstimos mensais de 1 a 5 vezes. Cadastro e alterações conforme permissões definidas pelo proprietário.</div>${can('loans','create')?`<div class="panel"><h2>Novo empréstimo</h2><form id="loanForm" onsubmit="createLoan(event)"><div class="grid"><div><label>Cliente</label><select id="loanClient" required><option value="">Selecione</option>${clients.filter(c=>statusOf(c)==='aprovado').map(c=>`<option value="${esc(c.id)}">${esc(c.nome_completo||c.cpf)}</option>`).join('')}</select></div><div><label>Valor emprestado (R$)</label><input id="loanPrincipal" type="number" min="0.01" step="0.01" required></div><div><label>Quantidade de parcelas</label><select id="loanCount">${[1,2,3,4,5].map(n=>`<option value="${n}">${n}x</option>`).join('')}</select></div><div><label>Valor de cada parcela (R$)</label><input id="loanAmount" type="number" min="0.01" step="0.01" required></div><div><label>Primeiro vencimento</label><input id="loanFirst" type="date" required></div></div><p class="small muted">Os vencimentos seguintes serão mensais. Os valores são definidos pela AGS.</p><button class="btn" type="submit">Cadastrar empréstimo</button></form></div>`:''}<div class="panel"><h2>Empréstimos cadastrados</h2><div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Emprestado</th><th>Parcelas</th><th>Valor/parcela</th><th>Primeiro vencimento</th><th>Ações</th></tr></thead><tbody>${loans.map(l=>`<tr><td>${esc(customerName(l))}</td><td>${money(l.valor_emprestado)}</td><td>${l.quantidade_parcelas}x</td><td>${money(l.valor_parcela)}</td><td>${localDate(l.primeiro_vencimento)}</td><td>${can('loans','edit_values')||can('loans','edit_dates')?`<button class="btn secondary" onclick="editLoan('${esc(l.id)}')">✎ Editar</button>`:'<span class="muted">Somente leitura</span>'}</td></tr>`).join('')||'<tr><td colspan="6">Nenhum empréstimo.</td></tr>'}</tbody></table></div></div>`}
window.createLoan=async e=>{e.preventDefault();if(!can('loans','create'))return alert('Sem permissão para cadastrar empréstimos.');const form=$('loanForm'),btn=form.querySelector('button[type=submit]');btn.disabled=true;try{await call('create_loan',{cadastro_id:$('loanClient').value,valor_emprestado:Number($('loanPrincipal').value),quantidade_parcelas:Number($('loanCount').value),valor_parcela:Number($('loanAmount').value),primeiro_vencimento:$('loanFirst').value});alert('Empréstimo cadastrado!');await loadFinance()}catch(e){alert(e.message)}finally{btn.disabled=false}};
function installmentsTable(overdueOnly=false){let list=installments.filter(p=>!overdueOnly||(!p.pago_em&&p.vencimento<todayLocal()));const query=($('financeSearch')?.value||'').toLowerCase();if(query)list=list.filter(p=>{const c=customer(loanById(p.emprestimo_id)?.cadastro_id);return [c?.nome_completo,c?.cpf].some(x=>String(x||'').toLowerCase().includes(query))});const month=$('financeMonth')?.value;if(month)list=list.filter(p=>p.vencimento.startsWith(month));return `<div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Parcela</th><th>Vencimento</th><th>Valor original</th><th>Situação</th><th>Ação</th></tr></thead><tbody>${list.map(p=>{const late=daysLate(p.vencimento),status=p.pago_em?'Paga':late?'Vencida':'Pendente';return `<tr><td>${esc(customerName(loanById(p.emprestimo_id)))}</td><td>${p.numero}ª</td><td>${localDate(p.vencimento)}</td><td>${money(p.valor)}</td><td><span class="pill ${p.pago_em?'ok':late?'late':'wait'}">${status}${!p.pago_em&&late?' • '+late+' dia(s)':''}</span></td><td>${p.pago_em?`<button class="btn secondary" onclick="openReceipt('${p.id}')">Ver comprovante</button>`:(can(currentPage,'pay')?`<button class="btn" onclick="payForm('${p.id}')">Registrar pagamento</button>`:'<span class="muted">Somente leitura</span>')}</td></tr>`}).join('')||'<tr><td colspan="6">Nenhuma parcela encontrada.</td></tr>'}</tbody></table></div>`}
function paymentsPage(overdueOnly=false){return `<div class="notice">${overdueOnly?'Consulte as parcelas vencidas e não pagas, com seus respectivos vencimentos e valores.':'Para registrar pagamento é obrigatório anexar o comprovante.'}</div><div class="panel"><div class="actions"><input id="financeSearch" placeholder="Filtrar nome ou CPF" oninput="filterFinance()" style="max-width:320px"><input id="financeMonth" type="month" onchange="filterFinance()" style="max-width:190px"><button class="btn secondary" onclick="loadFinance()">Atualizar</button></div><div id="financeRows">${installmentsTable(overdueOnly)}</div></div><div id="paymentModal"></div>`}
window.filterFinance=()=>{$('financeRows').innerHTML=installmentsTable(currentPage==='overdue')};
window.payForm=id=>{if(!can(currentPage,'pay'))return alert('Sem permissão para registrar pagamentos.');const p=installments.find(x=>x.id===id);if(!p||p.pago_em)return;const box=$('paymentModal');box.innerHTML=`<div class="panel" style="border-color:var(--gold)"><h2>Registrar pagamento — ${esc(customerName(loanById(p.emprestimo_id)))}</h2><p>Parcela ${p.numero} • Vencimento ${localDate(p.vencimento)}</p><form onsubmit="submitPayment(event,'${id}')"><div class="grid two"><div><label>Valor recebido (R$)</label><input id="payAmount" type="number" min="0.01" step="0.01" value="${Number(p.valor).toFixed(2)}" required></div><div><label>Comprovante obrigatório (PDF, JPG, PNG ou WEBP, até 5 MB)</label><input id="payFile" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp" required></div></div><p class="small muted">O comprovante ficará guardado em armazenamento privado, junto com o usuário responsável.</p><div class="actions"><button class="btn" type="submit">Confirmar pagamento</button><button class="btn secondary" type="button" onclick="document.getElementById('paymentModal').innerHTML=''">Cancelar</button></div></form></div>`;box.scrollIntoView({behavior:'smooth',block:'start'})};
window.submitPayment=async(e,id)=>{e.preventDefault();if(!can(currentPage,'pay'))return alert('Sem permissão.');const file=$('payFile').files[0],amount=Number($('payAmount').value);if(!file||file.size>5242880)return alert('Anexe comprovante de até 5 MB.');const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;try{const b64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(Error('Não foi possível ler o arquivo.'));reader.readAsDataURL(file)});await call('pay',{parcela_id:id,valor_recebido:amount,data_base64:b64,nome_arquivo:file.name,tipo_arquivo:file.type});alert('Pagamento registrado com comprovante!');await loadFinance()}catch(err){alert(err.message)}finally{btn.disabled=false}};
window.openReceipt=async id=>{if(!can(currentPage))return alert('Sem permissão.');try{const r=await call('receipt',{parcela_id:id});window.open(r.url,'_blank','noopener,noreferrer')}catch(e){alert(e.message)}};
const reportState={status:'all',from:'',to:'',search:''};
function reportRows(){return installments.map(p=>{const l=loanById(p.emprestimo_id),c=customer(l?.cadastro_id),late=!p.pago_em&&p.vencimento<todayLocal(),status=p.pago_em?'paid':late?'late':'pending';return {p,l,c,name:c?.nome_completo||'Cliente não localizado',cpf:c?.cpf||'',status,due:p.vencimento||'',paid:p.pago_em?String(p.pago_em).slice(0,10):'',amount:Number(p.valor||0),received:Number(p.valor_recebido||0),days:late?daysLate(p.vencimento):0}})}
function reportFiltered(){return reportRows().filter(r=>{const st=reportState.status;if(st!=='all'&&r.status!==st)return false;const q=reportState.search.toLocaleLowerCase('pt-BR');if(q&&![r.name,r.cpf].some(v=>String(v).toLocaleLowerCase('pt-BR').includes(q)))return false;const date=st==='paid'?r.paid:r.due;if(reportState.from&&date<reportState.from)return false;if(reportState.to&&date>reportState.to)return false;return true})}
window.selectReport=status=>{reportState.status=status;render()};
window.reportFilter=(field,value)=>{reportState[field]=value;const rows=$('reportResults'),summary=$('reportSummary');if(rows)rows.innerHTML=reportTableRows();if(summary)summary.innerHTML=reportSummaryHtml()};
function reportSummaryHtml(){const rs=reportFiltered(),received=rs.reduce((a,r)=>a+r.received,0),open=rs.filter(r=>r.status!=='paid').reduce((a,r)=>a+r.amount,0),late=rs.filter(r=>r.status==='late').reduce((a,r)=>a+r.amount,0);return `<div class="cards"><div class="card"><span class="muted">Parcelas no filtro</span><strong>${rs.length}</strong></div><div class="card"><span class="muted">Total recebido</span><strong>${money(received)}</strong></div><div class="card"><span class="muted">A receber</span><strong>${money(open)}</strong></div><div class="card"><span class="muted">Total vencido</span><strong style="color:var(--red)">${money(late)}</strong></div></div>`}
function reportTableRows(){return reportFiltered().sort((a,b)=>a.due.localeCompare(b.due)).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.cpf)}</td><td>${r.p.numero}ª / ${r.l?.quantidade_parcelas||'—'}</td><td>${localDate(r.due)}</td><td>${money(r.amount)}</td><td><span class="pill ${r.status==='paid'?'ok':r.status==='late'?'late':'wait'}">${r.status==='paid'?'Paga':r.status==='late'?'Vencida • '+r.days+' dia(s)':'Pendente'}</span></td><td>${r.paid?localDate(r.paid):'—'}</td><td>${r.paid?money(r.received):'—'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nenhuma parcela encontrada com estes filtros.</td></tr>'}
window.reportCSV=()=>{const rs=reportFiltered();const data=[['Cliente','CPF','Parcela','Vencimento','Valor da parcela','Situação','Dias em atraso','Data do pagamento','Valor recebido'],...rs.map(r=>[r.name,r.cpf,r.p.numero,r.due,r.amount.toFixed(2).replace('.',','),r.status==='paid'?'Paga':r.status==='late'?'Vencida':'Pendente',r.days,r.paid,r.received.toFixed(2).replace('.',',')])];const csv='\ufeff'+data.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='AGS_relatorio_'+reportState.status+'_'+todayLocal()+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
window.reportPrint=()=>{const rs=reportFiltered();const win=window.open('','_blank');if(!win)return alert('Permita janelas pop-up para imprimir o relatório.');const total=rs.reduce((a,r)=>a+r.amount,0),rec=rs.reduce((a,r)=>a+r.received,0);win.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>AGS | Relatório</title><style>body{font:13px Arial;padding:26px;color:#17202d}h1{color:#9b722c}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{border-bottom:1px solid #ddd;padding:9px;text-align:left}th{background:#f5f0e6}small{color:#666}@media print{button{display:none}}</style></head><body><h1>◆ AGS SERVIÇOS — RELATÓRIO FINANCEIRO</h1><small>Emitido em ${new Date().toLocaleString('pt-BR')} • ${esc(({all:'Todas',paid:'Pagas',late:'Vencidas',pending:'Pendentes'})[reportState.status])} • Período: ${esc(reportState.from||'Início')} a ${esc(reportState.to||'Hoje')}</small><p><b>${rs.length} parcelas</b> • Valor original: ${money(total)} • Recebido: ${money(rec)}</p><table><thead><tr><th>Cliente</th><th>Parcela</th><th>Vencimento</th><th>Valor</th><th>Situação</th><th>Pago em</th><th>Recebido</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.p.numero}ª</td><td>${localDate(r.due)}</td><td>${money(r.amount)}</td><td>${r.status==='paid'?'Paga':r.status==='late'?'Vencida':'Pendente'}</td><td>${r.paid?localDate(r.paid):'—'}</td><td>${r.paid?money(r.received):'—'}</td></tr>`).join('')}</tbody></table><p><small>Multas não incluídas. Relatório baseado nos registros atuais do sistema.</small></p></body></html>`);win.document.close();win.focus();setTimeout(()=>win.print(),300)};
window.clientReportCSV=st=>{const list=clients.filter(c=>st==='todos'||statusOf(c)===st);const data=[['Nome','CPF','Telefone','Data do cadastro','Situação','Motivo da reprovação','Analisado em'],...list.map(c=>[c.nome_completo||'',c.cpf||'',c.telefone||'',String(c.criado_em||'').slice(0,10),statusOf(c),c.motivo_reprovacao||'',c.analisado_em||''])];const csv='\ufeff'+data.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='AGS_cadastros_'+st+'_'+todayLocal()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function reports(){const all=reportRows(),paid=all.filter(r=>r.status==='paid'),late=all.filter(r=>r.status==='late'),pending=all.filter(r=>r.status==='pending');const loanTotal=loans.reduce((a,l)=>a+Number(l.valor_emprestado||0),0);return `<div class="reportHero"><div><div class="small gold" style="letter-spacing:2px;font-weight:800">◆ AGS SERVIÇOS • FINANCEIRO</div><h2 style="font-size:25px;margin:8px 0">Central de relatórios</h2><div class="muted">Consulte, filtre, imprima e exporte os dados reais dos empréstimos.</div></div><div class="actions"><button class="btn secondary" onclick="loadFinance()">↻ Atualizar dados</button><button class="btn secondary" onclick="reportCSV()">↓ Exportar Excel (CSV)</button><button class="btn" onclick="reportPrint()">▤ Imprimir / Salvar PDF</button></div></div><div class="cards" style="margin-top:17px"><div class="card"><span class="muted">Total emprestado</span><strong>${money(loanTotal)}</strong><span class="small muted">${loans.length} empréstimo(s)</span></div><div class="card"><span class="muted">Pagamentos recebidos</span><strong style="color:var(--green)">${money(paid.reduce((a,r)=>a+r.received,0))}</strong><span class="small muted">${paid.length} parcela(s) paga(s)</span></div><div class="card"><span class="muted">Parcelas vencidas</span><strong style="color:var(--red)">${money(late.reduce((a,r)=>a+r.amount,0))}</strong><span class="small muted">${late.length} parcela(s) atrasada(s)</span></div><div class="card"><span class="muted">A vencer</span><strong>${money(pending.reduce((a,r)=>a+r.amount,0))}</strong><span class="small muted">${pending.length} parcela(s) pendente(s)</span></div></div><div class="panel"><h2>Qual relatório deseja emitir?</h2><div class="reportTabs">${[['all','Todas as parcelas'],['paid','✓ Pagas'],['late','⚠ Atrasadas'],['pending','◷ A vencer']].map(([v,t])=>`<button class="reportTab ${reportState.status===v?'selected':''}" onclick="selectReport('${v}')">${t}</button>`).join('')}</div><div class="grid" style="margin-top:18px"><div><label>Buscar cliente ou CPF</label><input placeholder="Digite o nome ou CPF" value="${esc(reportState.search)}" oninput="reportFilter('search',this.value)"></div><div><label>Data inicial ${reportState.status==='paid'?'do pagamento':'do vencimento'}</label><input type="date" value="${esc(reportState.from)}" onchange="reportFilter('from',this.value)"></div><div><label>Data final</label><input type="date" value="${esc(reportState.to)}" onchange="reportFilter('to',this.value)"></div></div><p class="small muted">Nos relatórios de parcelas pagas, o período considera a data do pagamento. Nos demais, considera o vencimento.</p></div><div class="panel"><h2>Resumo do relatório selecionado</h2><div id="reportSummary">${reportSummaryHtml()}</div></div><div class="panel"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">Detalhamento das parcelas</h2><span class="tag">Dados da AGS</span></div><div class="tablewrap"><table><thead><tr><th>Cliente</th><th>CPF</th><th>Parcela</th><th>Vencimento</th><th>Valor</th><th>Situação</th><th>Pagamento</th><th>Recebido</th></tr></thead><tbody id="reportResults">${reportTableRows()}</tbody></table></div></div><div class="panel"><h2>Relatórios de cadastros</h2><p class="muted">Consulte os clientes aprovados, reprovados e pendentes de análise.</p><div class="reportTabs">${[['todos','Todos'],['aprovado','Aprovados'],['reprovado','Reprovados'],['pendente','Pendentes']].map(([st,label])=>`<button class="reportTab" onclick="clientReportCSV('${st}')">↓ Exportar ${label} (CSV)</button>`).join('')}</div><div class="tablewrap" style="margin-top:15px"><table><thead><tr><th>Situação</th><th>Quantidade</th></tr></thead><tbody>${[['pendente','Pendentes'],['aprovado','Aprovados'],['reprovado','Reprovados']].map(([st,label])=>`<tr><td>${label}</td><td>${clients.filter(c=>statusOf(c)===st).length}</td></tr>`).join('')}</tbody></table></div></div><div class="notice" style="margin-top:18px">Os relatórios mostram os valores registrados no sistema. Para salvar em PDF, utilize a opção de impressão do navegador.</div>`}

function pending(name){return `<div class="notice"><b>⏳ ${name}: próxima etapa de desenvolvimento</b><p>Esta área ainda não está conectada ao banco. Não serão criados empréstimos, parcelas ou alterações financeiras fictícias neste painel real.</p></div>`}
function whatsapp(){return `<div class="notice"><b>⏳ WhatsApp automático — aguardando ativação</b><p>Será necessário um número exclusivo, ativação na Meta, aprovação dos modelos de mensagens e integração ao sistema. Nenhuma mensagem é enviada por esta tela.</p></div><div class="panel"><h2>Mensagens previstas</h2><p>• Lembrete antes do vencimento</p><p>• Aviso no dia do vencimento</p><p>• Aviso de atraso</p><p>• Confirmação de pagamento</p></div>`}
function OLDaccess(){return `<div class="panel"><h2>Seu perfil: ${profile==='admin'?'Proprietário / Administrador':'Funcionário'}</h2><p>O acesso aos dados é autorizado pelo servidor e não por senha 1234 no navegador.</p><p>Funcionários podem consultar cadastros e documentos. O controle de alteração dos valores financeiros será protegido por regras no banco quando o módulo financeiro for implementado.</p></div>`}


const editableClientFields=[['Nome completo','nome_completo'],['Telefone','telefone'],['Endereço residencial','endereco_casa'],['Empresa','nome_empresa'],['Telefone da empresa','telefone_empresa'],['Endereço do trabalho','endereco_trabalho'],['Função','funcao'],['Telefone de referência','telefone_referencia'],['Chave PIX','chave_pix'],['Banco','banco']];
window.editClient=id=>{if(!can('clients','edit'))return alert('Sem permissão.');const c=customer(id);if(!c)return;const box=document.createElement('div');box.id='clientEditBox';box.className='panel';box.innerHTML=`<h2>✎ Editar cadastro — ${esc(c.nome_completo)}</h2><form onsubmit="saveClient(event,'${esc(id)}')"><div class="grid">${editableClientFields.map(([label,key])=>`<div><label>${label}</label><input data-client-field="${key}" maxlength="250" value="${esc(c[key]||'')}"></div>`).join('')}</div><div class="actions" style="margin-top:15px"><button class="btn">Salvar cadastro</button><button class="btn secondary" type="button" onclick="document.getElementById('clientEditBox')?.remove()">Cancelar</button></div></form></div>`;document.getElementById('clientEditBox')?.remove();$('content').prepend(box);box.scrollIntoView({behavior:'smooth'})};
window.saveClient=async(e,id)=>{e.preventDefault();if(!can('clients','edit'))return;const dados={};document.querySelectorAll('#clientEditBox [data-client-field]').forEach(el=>dados[el.dataset.clientField]=el.value.trim());if(!confirm('Salvar alterações do cliente?'))return;try{await call('client_update',{cadastro_id:id,dados});alert('Cadastro atualizado.');await refresh();chosen=customer(id);currentPage='detail';render()}catch(e){alert(e.message)}};

const permissionLabels={dashboard:'Visão geral',clients:'Clientes',documents:'Documentos',loans:'Empréstimos',payments:'Parcelas',overdue:'Vencidos',whatsapp:'WhatsApp',reports:'Relatórios'};
const actionsByArea={dashboard:[['view','Visualizar']],clients:[['view','Visualizar e analisar (aprovar/reprovar)'],['edit','Editar cadastro'],['delete','Excluir cadastro']],documents:[['view','Visualizar documentos']],loans:[['view','Visualizar'],['create','Cadastrar empréstimos'],['edit_values','Editar valores e parcelas'],['edit_dates','Editar vencimentos']],payments:[['view','Visualizar'],['pay','Registrar pagamento']],overdue:[['view','Visualizar'],['pay','Registrar pagamento']],whatsapp:[['view','Visualizar']],reports:[['view','Visualizar e exportar']]};
let selectedStaff=null;
async function loadStaff(){if(profile!=='admin')return;try{const r=await call('staff_list');staff=r.funcionarios||[];render()}catch(e){alert('Funcionários: '+e.message)}}
function access(){if(profile!=='admin')return '<div class="panel">Acesso restrito ao proprietário.</div>';return `<div class="notice">◆ Proprietário: acesso completo. Cadastre funcionários e defina exatamente o que cada um pode fazer. As permissões também são verificadas no servidor.</div><div class="panel"><h2>+ Novo funcionário</h2><form onsubmit="createStaff(event)"><div class="grid"><div><label>Nome completo</label><input id="staffName" required maxlength="120"></div><div><label>E-mail de login</label><input id="staffEmail" type="email" required></div><div><label>Senha inicial (mínimo 10 caracteres)</label><input id="staffPass" type="password" minlength="10" required autocomplete="new-password"></div></div><p class="small muted">Após criar, configure as permissões abaixo. Por segurança, o novo usuário começa sem acesso às abas.</p><button class="btn">Cadastrar funcionário</button></form></div><div class="panel"><h2>Funcionários cadastrados</h2>${staff.map(s=>`<div class="info" style="margin-bottom:12px"><div class="actions" style="justify-content:space-between"><div><b>${esc(s.nome||'Funcionário')}</b><p class="small muted">${esc(s.email||'')} • ${s.ativo?'Ativo':'Bloqueado'}</p></div><div class="actions"><button class="btn secondary" onclick="selectStaff('${esc(s.user_id)}')">⚙ Permissões</button><button class="btn ${s.ativo?'danger':'secondary'}" onclick="toggleStaff('${esc(s.user_id)}',${!s.ativo})">${s.ativo?'Bloquear':'Reativar'}</button></div></div></div>`).join('')||'<p class="muted">Nenhum funcionário cadastrado.</p>'}</div>${selectedStaff?staffEditor():''}`}
function staffEditor(){const s=staff.find(x=>x.user_id===selectedStaff);if(!s)return '';const p=s.permissoes||{};return `<div class="panel" id="staffEditor"><h2>Permissões de ${esc(s.nome||s.email)}</h2><p class="muted">Marque apenas o que este funcionário poderá fazer. Para liberar edição, a visualização da mesma aba será habilitada automaticamente.</p>${areas.map(a=>`<div class="info" style="margin-bottom:12px"><h3 class="gold" style="margin:0 0 12px">${permissionLabels[a]}</h3><div class="actions">${actionsByArea[a].map(([key,label])=>`<label style="display:inline-flex;gap:7px;align-items:center;margin-right:16px"><input style="width:auto" type="checkbox" data-area="${a}" data-action="${key}" ${p[a]?.includes(key)?'checked':''}>${label}</label>`).join('')}</div></div>`).join('')}<div class="actions"><button class="btn" onclick="saveStaffPermissions()">Salvar permissões</button><button class="btn secondary" onclick="closeStaffEditor()">Fechar</button></div></div>`}
window.closeStaffEditor=()=>{selectedStaff=null;render();};
window.selectStaff=id=>{selectedStaff=id;render();document.getElementById('staffEditor')?.scrollIntoView({behavior:'smooth'})};
window.createStaff=async e=>{e.preventDefault();const name=$('staffName').value.trim(),email=$('staffEmail').value.trim(),password=$('staffPass').value;try{await call('staff_create',{nome:name,email,password});selectedStaff=null;alert('Funcionário criado. Agora configure as permissões.');await loadStaff()}catch(e){alert(e.message)}};
window.toggleStaff=async(id,ativo)=>{if(!confirm(ativo?'Reativar este funcionário?':'Bloquear o acesso deste funcionário?'))return;try{await call('staff_status',{user_id:id,ativo});await loadStaff()}catch(e){alert(e.message)}};
window.saveStaffPermissions=async()=>{const p={};document.querySelectorAll('#staffEditor input[data-area]').forEach(c=>{if(c.checked)(p[c.dataset.area]??=[]).push(c.dataset.action)});for(const a of areas){if(p[a]?.some(x=>x!=='view')&&!p[a].includes('view'))p[a].push('view')}try{await call('staff_permissions',{user_id:selectedStaff,permissoes:p});selectedStaff=null;await loadStaff();alert('Permissões salvas!')}catch(e){alert(e.message)}};
window.editLoan=id=>{if(!can('loans','edit_values')&&!can('loans','edit_dates'))return alert('Sem permissão.');const l=loanById(id);if(!l)return;const valueEdit=can('loans','edit_values'),dateEdit=can('loans','edit_dates');const box=document.createElement('div');box.id='editLoanBox';box.className='panel';box.innerHTML=`<h2>✎ Editar empréstimo — ${esc(customerName(l))}</h2><p class="muted">Parcelas já pagas ficam preservadas. Alterações serão registradas no histórico.</p><form onsubmit="saveLoanEdit(event,'${esc(id)}')"><div class="grid"><div><label>Valor emprestado</label><input id="editPrincipal" type="number" min="0.01" step="0.01" value="${Number(l.valor_emprestado)}" ${valueEdit?'':'disabled'} required></div><div><label>Quantidade de parcelas</label><select id="editCount" ${valueEdit?'':'disabled'}>${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===l.quantidade_parcelas?'selected':''}>${n}x</option>`).join('')}</select></div><div><label>Valor de cada parcela</label><input id="editAmount" type="number" min="0.01" step="0.01" value="${Number(l.valor_parcela)}" ${valueEdit?'':'disabled'} required></div><div><label>Primeiro vencimento</label><input id="editFirst" type="date" value="${esc(l.primeiro_vencimento)}" ${dateEdit?'':'disabled'} required></div></div><p class="small muted">Se houver parcelas pagas, o sistema não permitirá mudar quantidade ou vencimentos anteriores.</p><div class="actions"><button class="btn">Salvar alterações</button><button class="btn secondary" type="button" onclick="document.getElementById('editLoanBox')?.remove()">Cancelar</button></div></form>`;document.getElementById('editLoanBox')?.remove();$('content').prepend(box);box.scrollIntoView({behavior:'smooth'})};
window.saveLoanEdit=async(e,id)=>{e.preventDefault();const l=loanById(id);if(!l)return;const payload={emprestimo_id:id,valor_emprestado:can('loans','edit_values')?Number($('editPrincipal').value):Number(l.valor_emprestado),quantidade_parcelas:can('loans','edit_values')?Number($('editCount').value):l.quantidade_parcelas,valor_parcela:can('loans','edit_values')?Number($('editAmount').value):Number(l.valor_parcela),primeiro_vencimento:can('loans','edit_dates')?$('editFirst').value:l.primeiro_vencimento};if(!confirm('Salvar alterações deste empréstimo?'))return;try{await call('loan_update',payload);alert('Empréstimo atualizado.');await loadFinance()}catch(e){alert(e.message)}};

function render(){if($('app').classList.contains('hidden'))return;const names={dashboard:'Visão geral',clients:'Clientes cadastrados',detail:'Dados do cliente',documents:'Documentos',loans:'Empréstimos',payments:'Parcelas',whatsapp:'WhatsApp automático',reports:'Relatórios',overdue:'Vencidos',access:'Gestão de Acessos'};$('heading').textContent=names[currentPage]||'AGS';$('menu').innerHTML=menu.filter(([key])=>can(key)).map(([key,icon,label])=>`<button class="nav ${currentPage===key?'active':''}" onclick="nav('${key}')"><span>${icon}</span>${label}</button>`).join('');$('content').innerHTML=(!can(currentPage==='detail'?'clients':currentPage)?'<div class="panel">Acesso não autorizado.</div>':loading?'<div class="panel">Carregando cadastros...</div>':({dashboard,clients:clientsPage,detail,documents,loans:loansPage,payments:()=>paymentsPage(false),overdue:()=>paymentsPage(true),whatsapp,reports,access})[currentPage]());}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';$('loginBtn').disabled=true;try{if(SUPABASE_ANON_KEY.startsWith('COLE_AQUI'))throw Error('Falta configurar a conexão do sistema.');const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw Error('E-mail ou senha inválidos.');$('login').classList.add('hidden');$('app').classList.remove('hidden');await refresh()}catch(err){$('loginError').textContent=err.message;}finally{$('loginBtn').disabled=false}});
const {data:{session}}=await supabase.auth.getSession();if(session){$('login').classList.add('hidden');$('app').classList.remove('hidden');await refresh();}
</script></body></html>
